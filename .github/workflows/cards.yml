name: Render cards
on:
  push:
    branches: [main]
    paths:
      - "profile.yml"
      - "scripts/**"
      - "assets/fonts/*.woff2"
      - ".github/workflows/cards.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Render SVG cards
        run: npm run cards
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/*.svg
          if git diff --staged --quiet; then
            echo "No card changes"
          else
            git commit -m "chore: regenerate profile cards"
            git push
          fi
