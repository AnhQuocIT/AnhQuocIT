# Daily GitHub metrics — themed to match profile cards (dark + cyan accent).
# Requires repo secret METRICS_TOKEN: classic PAT with scopes `repo` + `read:user`.
name: Metrics
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AnhQuocIT
          output_action: commit
          committer_message: "chore: update metrics"
          config_timezone: Asia/Ho_Chi_Minh
          config_display: large
          config_order: isocalendar, languages, habits
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: html, css, dockerfile, markdown, json, yaml, yml
          plugin_languages_skipped: MusicApp-Android-Studio, Java-Lab-example, covid-app, E-commerce-Website-Using-VueJS-SpringBoot, E-commerce-Website-Using-Angular-SpringBoot, DGHOME
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          extras_css: |
            /* Align with design-system/MASTER.md — Dark OLED + cyan accent */
            .metrics {
              --color-bg: #11161D !important;
              --color-border: #1F2630 !important;
              --color-text: #E6EDF3 !important;
              background: #11161D !important;
              border: 1px solid #1F2630 !important;
              border-radius: 16px !important;
              color: #E6EDF3 !important;
            }
            h2, h3, .title { color: #7DD3FC !important; }
            .fill-fg, .contribution-graph .day { filter: saturate(1.1); }
